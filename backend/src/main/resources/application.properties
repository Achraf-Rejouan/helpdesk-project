spring.application.name=helpdesk

spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk_db
spring.datasource.username=helpdesk
spring.datasource.password=helpdesk123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# The real secret is supplied through the JWT_SECRET environment variable (see backend/.env).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Development defaults for the initial admin seed. Override them in backend/.env.
app.admin.email=${ADMIN_EMAIL:admin@helpdesk.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345}
